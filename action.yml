name: pyscythe
description: Codebase intelligence for Python. Dead code, import cycles, complexity, duplication, boundaries, and dependencies.
branding:
  icon: scissors
  color: green
inputs:
  command:
    description: Which analysis to run. One of dead-code, cycles, health, dupes, boundaries, deps.
    default: dead-code
  path:
    description: Project root, or any path inside it.
    default: .
  args:
    description: Extra arguments, for example "--min-confidence medium --baseline .pyscythe-baseline.json".
    default: ""
  since:
    description: Only report findings in files changed since this git ref. Leave empty to report everything.
    default: ""
  format:
    description: Output format. github writes workflow annotations; sarif writes a file you can upload to code scanning.
    default: github
  sarif-file:
    description: Where to write the SARIF log when format is sarif.
    default: pyscythe.sarif
  version:
    description: The pyscythe release to install from PyPI, such as 0.1.0. Leave empty for the latest.
    default: ""
runs:
  using: composite
  steps:
    - name: Install uv
      uses: astral-sh/setup-uv@v6
    - name: Install pyscythe
      shell: bash
      run: |
        spec="pyscythe"
        if [ -n "${{ inputs.version }}" ]; then
          spec="pyscythe==${{ inputs.version }}"
        fi
        uv tool install "$spec"
        pyscythe --version
    - name: Run pyscythe
      shell: bash
      run: |
        set -o pipefail
        since=""
        if [ -n "${{ inputs.since }}" ]; then
          git fetch --no-tags --depth=1 origin "${{ inputs.since }}" || true
          since="--since ${{ inputs.since }}"
        fi
        if [ "${{ inputs.format }}" = "sarif" ]; then
          pyscythe "${{ inputs.command }}" "${{ inputs.path }}" --format sarif $since ${{ inputs.args }} > "${{ inputs.sarif-file }}" || true
          echo "Wrote ${{ inputs.sarif-file }}"
        else
          pyscythe "${{ inputs.command }}" "${{ inputs.path }}" --format "${{ inputs.format }}" $since ${{ inputs.args }}
        fi
