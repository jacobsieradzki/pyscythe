# Cut a release: build the binary wheel for every platform, publish to PyPI
# through trusted publishing (no token in the repo), and attach everything to
# a GitHub Release. Runs on a `v*` tag; the version comes from Cargo.toml and
# must match the tag.
name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: The tag must match the workspace version
        if: github.ref_type == 'tag'
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          tag="${GITHUB_REF_NAME#v}"
          if [ "$version" != "$tag" ]; then
            echo "Cargo.toml says $version but the tag is v$tag" >&2
            exit 1
          fi

  wheels:
    needs: check-version
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu, manylinux: "2_28" }
          - { os: ubuntu-latest, target: aarch64-unknown-linux-gnu, manylinux: "2_28" }
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: macos-latest, target: x86_64-apple-darwin }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
    runs-on: ${{ matrix.os }}
    env:
      # ruff's checkout has snapshot files whose paths pass Windows' 260
      # character limit; the git CLI with long paths on copes, libgit2 does not.
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
    steps:
      - name: Allow long paths on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          git config --system core.longpaths true
          New-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem" -Name "LongPathsEnabled" -Value 1 -PropertyType DWORD -Force | Out-Null
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux || 'auto' }}
          args: --release --locked --out dist
      - name: The wheel runs
        if: matrix.target != 'aarch64-unknown-linux-gnu' && matrix.target != 'x86_64-apple-darwin'
        shell: bash
        run: |
          pip install --no-index --find-links dist pyscythe
          pyscythe --version
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.target }}
          path: dist/*.whl

  sdist:
    needs: check-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  # Homebrew and a plain download want a binary, not a wheel, and the wheels
  # already hold one; repacking them is cheaper and more honest than a second
  # build of the same code.
  binaries:
    needs: wheels
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: wheel-*
          path: wheels
          merge-multiple: true
      - name: Repack the wheels as archives
        run: packaging/binaries.sh wheels archives
      - uses: actions/upload-artifact@v4
        with:
          name: archives
          path: archives/*

  publish:
    needs: [wheels, sdist, binaries]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    # The `pypi` environment is what PyPI's trusted publisher is bound to.
    environment: pypi
    permissions:
      id-token: write
      contents: write
    steps:
      # Only the wheels and the sdist go to PyPI; the archives go to the
      # release, so they are downloaded apart from them.
      - uses: actions/download-artifact@v4
        with:
          pattern: wheel-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: sdist
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: archives
          path: archives
      - name: What is being published
        run: ls -l dist archives
      - uses: pypa/gh-action-pypi-publish@release/v1
      - name: GitHub Release with the same files
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*
            archives/*
          generate_release_notes: true

  # The Homebrew tap and the pre-commit mirror are repositories of their own,
  # so this needs a token of its own. Without one the release still succeeds
  # and they stay on the previous version.
  downstream:
    needs: publish
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.DOWNSTREAM_TOKEN }}
      VERSION: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: archives
          path: archives
      - name: The version, without the v
        run: echo "VERSION=${VERSION#v}" >> "$GITHUB_ENV"
      - name: Set an author for both pushes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Homebrew tap
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::DOWNSTREAM_TOKEN is not set; the tap keeps its previous version"
            exit 0
          fi
          git clone --depth 1 "https://x-access-token:$GH_TOKEN@github.com/jacobsieradzki/homebrew-tap" tap
          mkdir -p tap/Formula
          packaging/homebrew.sh "$VERSION" archives > tap/Formula/pyscythe.rb
          cd tap
          git add Formula/pyscythe.rb
          git diff --cached --quiet || git commit -m "pyscythe $VERSION"
          git push
      - name: pre-commit mirror
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::DOWNSTREAM_TOKEN is not set; the pre-commit mirror keeps its previous version"
            exit 0
          fi
          git clone --depth 1 "https://x-access-token:$GH_TOKEN@github.com/jacobsieradzki/pyscythe-pre-commit" mirror
          packaging/pre-commit.sh "$VERSION" mirror
          cd mirror
          git add -A
          git diff --cached --quiet || git commit -m "pyscythe $VERSION"
          git tag "v$VERSION"
          git push origin HEAD "v$VERSION"
